
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>กำลังเข้าสู่ระบบ | FINORA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      color: #182230;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #fff;
      border: 1px solid #e7ebf2;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(20, 35, 60, .07);
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 22px;
      border: 4px solid #e5eaf2;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    h1 { font-size: 21px; margin: 0 0 12px; }
    p { color: #667085; font-size: 14px; line-height: 1.7; }
    .error { color: #b42318; }
    a { color: #245fe8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <main class="panel" aria-live="polite">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">กำลังตรวจสอบการเข้าสู่ระบบ</h1>
    <p id="message">กรุณารอสักครู่ อย่าปิดหน้านี้</p>
  </main>

  <script>
    (() => {
      "use strict";

      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbwWEJQPg0aOWSUMSiMVi2d-LQ9Z7wGh12lnA3G61W-Q-kmJPUb5E-MxPmuLH05V4MGL5g/exec";

      const heading = document.getElementById("heading");
      const message = document.getElementById("message");
      const spinner = document.getElementById("spinner");

      function showError(text) {
        spinner.hidden = true;
        heading.textContent = "เข้าสู่ระบบไม่สำเร็จ";
        message.className = "error";
        message.textContent = text;
      }

      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      if (error) {
        showError(
          error === "access_denied"
            ? "คุณยกเลิกการอนุญาตเข้าสู่ระบบผ่าน LINE"
            : "LINE ไม่สามารถดำเนินการเข้าสู่ระบบได้ กรุณาลองใหม่"
        );
        return;
      }

      if (!code || !state || !/^[A-Za-z0-9_-]{20,200}$/.test(state)) {
        showError("ข้อมูล Callback ไม่ครบหรือไม่ถูกต้อง กรุณากลับไปเริ่มเข้าสู่ระบบใหม่");
        return;
      }

      heading.textContent = "กำลังยืนยันตัวตนกับ LINE";
      message.textContent = "ระบบกำลังส่งคำขอไปตรวจสอบอย่างปลอดภัย";

      // ส่ง code และ state ให้เซิร์ฟเวอร์ตรวจสอบ
      // ไม่แลก Token และไม่เก็บ Channel Secret ในหน้านี้
      const target = new URL(GAS_URL);
      target.searchParams.set("action", "lineCallback");
      target.searchParams.set("code", code);
      target.searchParams.set("state", state);

      // ล้าง code ออกจาก address bar ก่อนออกจากหน้านี้
      window.history.replaceState({}, document.title,
        window.location.pathname);

      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
